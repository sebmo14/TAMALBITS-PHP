<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamalbits - Tienda</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-shop text-primary"></i> Tamalbits Web
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Tienda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="historial.html">Historial de Compras</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- User Panel -->
        <div class="user-panel">
            <div class="d-flex align-items-center gap-4">
                <div class="balance-box">
                    <h4>Saldo Disponible</h4>
                    <div class="amount" id="userBalance">Cargando...</div>
                </div>
                <div id="balanceError" class="text-danger d-none">
                    <i class="bi bi-exclamation-triangle"></i> Error al cargar saldo
                </div>
            </div>
            
            <div class="tamalbits-badge">
                <i class="bi bi-star-fill"></i>
                <span id="userTamalbits">0</span> Tamalbits
            </div>
        </div>

        <h2 class="mb-4 fw-bold">Productos Disponibles</h2>

        <!-- Product Grid -->
        <div class="row g-4" id="productGrid">
            <!-- Los productos se cargarán dinámicamente aquí -->
            <div class="col-12 text-center py-5" id="loadingProducts">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container para notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Compra realizada con éxito.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Database Mock JS -->
    <script src="js/database.js"></script>
    <!-- Main App JS -->
    <script src="js/app.js"></script>
</body>
</html>
