<!DOCTYPE html>
<html lang="es">
<head>
    <!-- 
        Capa de Presentación: Historial de Transacciones
        Esta vista permite al usuario revisar sus compras pasadas y los puntos obtenidos.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamalbits - Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-shop text-primary"></i> Tamalbits Web
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Tienda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="historial.html">Historial de Compras</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="user-panel">
            <div class="d-flex align-items-center gap-4">
                <div class="balance-box">
                    <h4>Saldo Disponible</h4>
                    <div class="amount" id="userBalance">Cargando...</div>
                </div>
            </div>
            
            <div class="tamalbits-badge">
                <i class="bi bi-star-fill"></i>
                <span id="userTamalbits">0</span> Tamalbits
            </div>
        </div>

        <h2 class="mb-4 fw-bold">Tu Historial de Compras</h2>

        <div class="row">
            <!-- Contenedor del Historial: Se llena dinámicamente mediante renderHistory() -->
            <div class="col-12" id="historyContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Evento de inicialización: Dispara la carga del historial al terminar de cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            renderHistory();
        });
    </script>
</body>
</html>
